      - MAA_14b_structural_coverage_7_8_candidate_selected_complete
      - MAA_14c_fresh_confirmatory_holdout_pass_complete
      - MAA_14d_Gate_A1_exact_u32_device_layout_in_progress_PR_284
      - MAA_14d_Gate_A2_exact_WGPU_sparse_numerical_carrier
      - MAA_14d_physical_same_device_measurement_only_after_Gate_A
  sml_genius_track:
    name: Delta_KV
    objective: >-
      Evaluate bounded rewritable associative memory with deterministic low-bit or
      fixed-point reference semantics as a complement to SML recurrent state and
      mapped context, not as a Transformer KV-cache clone.
    ownership: Memorithm/SML-GENIUS
