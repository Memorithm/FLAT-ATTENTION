      - existing_bounded_direct_associative_memory
      - immutable_or_append_only_context_records
      - matched_capacity_fixed_memory_controls
    required_metrics:
      - exact_storage_bits_including_metadata
      - read_write_operation_counts
      - overwrite_correction_error
      - interference_under_overlapping_keys
      - retained_task_quality
      - latency_only_when_measured
