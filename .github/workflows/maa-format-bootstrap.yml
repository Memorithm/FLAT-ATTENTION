name: maa-format-bootstrap

on:
  push:
    branches: ['fix/maa-oracle-provenance']
    paths: ['.github/workflows/maa-format-bootstrap.yml']

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Memorithm/FLAT-ATTENTION' && github.ref == 'refs/heads/fix/maa-oracle-provenance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - name: Apply exact scoped corrections and documentation anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              if text.count(before) != 1:
                  raise SystemExit(f'Expected exactly one anchor in {path}')
              p.write_text(text.replace(before, after, 1))

          replace_once(
              'crates/flat-algebraic-attention/src/evidence.rs',
              'score_work_avoided_vs_dense_for_test()',
              'score_work_avoided()',
          )
          replace_once(
              'README.md',
              '## Non-negotiable design rules\n',
              '## Multi-Algebra Attention research\n\n'
              'The research-only `flat-algebraic-attention` crate coordinates Boolean admission,\n'
              'finite-field `F2` predicates, Zhegalkin polynomials and max-plus readiness constraints.\n'
              'MAA-8 derives matched dense / Boolean-only / multi-algebra evidence from canonical\n'
              'host oracles. MAA-9 binds those records to their qualification route, metadata\n'
              'generation and candidate identity, and rejects impossible coverage/timing summaries.\n\n'
              'See the [MAA contract](docs/research/MULTI_ALGEBRA_ATTENTION.md) and\n'
              '[MAA-9 integrity gates and next experiments](docs/research/MAA_EVIDENCE_INTEGRITY.md).\n'
              'This is host correctness qualification, not a replacement for softmax or a GPU\n'
              'performance result. The stable attention API and default routing are unchanged.\n\n'
              '## Non-negotiable design rules\n',
          )
          replace_once(
              'docs/research/MULTI_ALGEBRA_ATTENTION.md',
              '- **MAA-GPU**:',
              '- **MAA-8**: derive matched arms from the canonical mask, survivor oracle and one reference relevance set.\n'
              '- **MAA-9**: bind evidence to its original route, metadata generation and candidate mapping; validate realizable intersection and observed-latency summaries. See [integrity gates and continuation protocol](MAA_EVIDENCE_INTEGRITY.md).\n'
              '- **MAA-GPU**:',
          )
          PY
          cargo fmt --all
          python3 - <<'PY'
          import subprocess
          allowed = {
              'README.md',
              'docs/research/MULTI_ALGEBRA_ATTENTION.md',
              'crates/flat-algebraic-attention/src/evidence.rs',
              'crates/flat-algebraic-attention/src/survivor_set.rs',
              'crates/flat-algebraic-attention/tests/matched_provenance.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed.issubset(allowed):
              raise SystemExit(f'Unexpected changes: {changed - allowed}')
          PY
          git diff --check
      - name: Commit the scoped patch without force pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/research/MULTI_ALGEBRA_ATTENTION.md \
            crates/flat-algebraic-attention/src/evidence.rs \
            crates/flat-algebraic-attention/src/survivor_set.rs \
            crates/flat-algebraic-attention/tests/matched_provenance.rs
          git commit -m 'style(maa): format evidence guards and synchronize research documentation'
          git push origin HEAD:refs/heads/fix/maa-oracle-provenance
          git rev-parse HEAD
      - name: Compile and test the prepared host code
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p flat-algebraic-attention -- --check
          cargo clippy -p flat-algebraic-attention --locked --all-targets -- -D warnings
          cargo test -p flat-algebraic-attention --locked --all-targets -- --nocapture
