name: BKV K6.4 command provenance fix

on:
  push:
    branches:
      - research/bkv-k6-harness-evidence-output-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/bkv-k6-harness-evidence-output-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Apply provenance fix
        run: python3 tools/_bkv_k64_command_patch.py
      - name: Validate targeted harness
        run: |
          cargo fmt --all
          cargo test --features wgpu --test bkv6_m16_qualification --no-run
          cargo clippy --features wgpu --test bkv6_m16_qualification -- -D warnings
          git diff --check
      - name: Commit final provenance fix
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git rm .github/workflows/bkv-k64-command-fix.yml
          git rm tools/_bkv_k64_command_patch.py
          git add tests/bkv6_m16_qualification.rs
          git commit -m "fix: record exact BKV-K6 benchmark command"
          git push origin HEAD:research/bkv-k6-harness-evidence-output-v2
