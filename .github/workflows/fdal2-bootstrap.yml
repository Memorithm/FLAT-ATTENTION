name: FDAL2 bootstrap

on:
  push:
    branches:
      - research/fdal2-compressed-decode-oracle
    paths:
      - ".github/workflows/fdal2-bootstrap.yml"

permissions:
  contents: write

jobs:
  insert-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/fdal2-compressed-decode-oracle
      - name: Insert FDAL2 child module and remove bootstrap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/research_da_luc_oracle.rs")
          text = path.read_text()
          needle = "pub const DA_LUC_ORACLE_PAYLOAD_VERSION: u16 = 1;\n"
          insertion = needle + "\n/// Research-only direct q_len=1 compressed-attention oracle (FDAL2).\n#[path = \"research_da_luc_decode_oracle.rs\"]\npub mod decode;\n"
          if "pub mod decode;" not in text:
              if needle not in text:
                  raise SystemExit("FDAL2 insertion anchor not found")
              text = text.replace(needle, insertion, 1)
              path.write_text(text)
          PY
          rm .github/workflows/fdal2-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_da_luc_oracle.rs .github/workflows/fdal2-bootstrap.yml
          git commit -m "feat(fdal2): expose compressed decode child oracle"
          git push origin HEAD:research/fdal2-compressed-decode-oracle
