name: FDAL2 rustfmt bootstrap

on:
  push:
    branches:
      - research/fdal2-compressed-decode-oracle

permissions:
  contents: write

jobs:
  rustfmt-and-self-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/fdal2-compressed-decode-oracle
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Format FDAL2 and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/fdal2-rustfmt-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(fdal2): apply rustfmt"
          git push origin HEAD:research/fdal2-compressed-decode-oracle
