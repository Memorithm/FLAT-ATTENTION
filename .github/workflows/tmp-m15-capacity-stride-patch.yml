name: Temporary M40 manifest module wiring

on:
  push:
    branches: ["feat/m40-benchmark-manifest"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/m40-benchmark-manifest
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Export M40 module and restore helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          text = path.read_text()
          marker = '/// Versioned backend-neutral reusable API.\npub mod api;\n'
          replacement = marker + '\n/// Machine-readable reproducible benchmark provenance.\npub mod benchmark_manifest;\n'
          if 'pub mod benchmark_manifest;' not in text:
              if marker not in text:
                  raise SystemExit('lib.rs API marker not found')
              text = text.replace(marker, replacement, 1)
              path.write_text(text)
          PY
          cargo fmt --all
          git checkout origin/main -- .github/workflows/tmp-m15-capacity-stride-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/benchmark_manifest.rs .github/workflows/tmp-m15-capacity-stride-patch.yml
          git commit -m 'feat(m40): expose benchmark manifest schema'
          git push origin HEAD:feat/m40-benchmark-manifest
