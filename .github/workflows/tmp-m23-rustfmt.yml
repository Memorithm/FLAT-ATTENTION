name: tmp-m23-rustfmt

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/m23-caller-owned-grouped-forward'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m23-caller-owned-grouped-forward
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Apply rustfmt
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
      - name: Commit formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-m23-rustfmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style(m23): format training-chain qualification'
          git push origin HEAD:feat/m23-caller-owned-grouped-forward
