name: FDAL5b branch normalization

on:
  push:
    branches:
      - "feat/fdal5b-tier-baseline-qualification"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/fdal5b-tier-baseline-qualification
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict FDAL5b lint
        run: cargo clippy -p flat-da-luc-tier-qualification --all-targets -- -D warnings
      - name: FDAL5b tests
        run: cargo test -p flat-da-luc-tier-qualification -- --nocapture
      - name: Commit generated branch artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock crates/flat-da-luc-tier-qualification
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(fdal5b): normalize lockfile and formatting"
          git push origin HEAD:feat/fdal5b-tier-baseline-qualification
