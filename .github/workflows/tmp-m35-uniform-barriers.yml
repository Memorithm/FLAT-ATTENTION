name: tmp-m35-uniform-barriers

on:
  push:
    branches:
      - feat/m35-d3d12-windows-qualification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/m35-d3d12-windows-qualification
          fetch-depth: 0
      - name: Make pre-barrier loops uniform across the workgroup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('shaders/flat_fwd_projection_rope_asymmetric.wgsl')
          text = path.read_text()

          old_q = '''    var q_linear = lane;
    loop {
        if (q_linear >= q_pair_count) {
            break;
        }
        let row = q_linear / half_dim;
        let pair = q_linear - row * half_dim;
        let query_pos = query_start + row;
        if (query_pos < params.q_len) {
            let base = row * MAX_HEAD_DIM + 2u * pair;
            let rotated = rope_pair(
                q_shared[base],
                q_shared[base + 1u],
                pair,
                query_pos + params.q_rope_offset,
                params.head_dim,
                theta,
            );
            q_shared[base] = rotated.x;
            q_shared[base + 1u] = rotated.y;
        }
        q_linear += WORKGROUP_SIZE;
    }
'''
          new_q = '''    for (var q_step = 0u; q_step < 4u; q_step += 1u) {
        let q_linear = lane + q_step * WORKGROUP_SIZE;
        if (q_linear < q_pair_count) {
            let row = q_linear / half_dim;
            let pair = q_linear - row * half_dim;
            let query_pos = query_start + row;
            if (query_pos < params.q_len) {
                let base = row * MAX_HEAD_DIM + 2u * pair;
                let rotated = rope_pair(
                    q_shared[base],
                    q_shared[base + 1u],
                    pair,
                    query_pos + params.q_rope_offset,
                    params.head_dim,
                    theta,
                );
                q_shared[base] = rotated.x;
                q_shared[base + 1u] = rotated.y;
            }
        }
    }
'''

          old_load = '''        var linear = lane;
        loop {
            if (linear >= tile_elements) {
                break;
            }
            let tile_row = linear / params.head_dim;
            let dim = linear - tile_row * params.head_dim;
            let key_pos = tile_start + tile_row;
            let row = batch_index * params.kv_len + key_pos;
            let global_index = row * kv_width + kv_head * params.head_dim + dim;
            let shared_index = tile_row * MAX_HEAD_DIM + dim;
            k_shared[shared_index] = k[global_index];
            v_shared[shared_index] = v[global_index];
            linear += WORKGROUP_SIZE;
        }
'''
          new_load = '''        for (var load_step = 0u; load_step < 16u; load_step += 1u) {
            let linear = lane + load_step * WORKGROUP_SIZE;
            if (linear < tile_elements) {
                let tile_row = linear / params.head_dim;
                let dim = linear - tile_row * params.head_dim;
                let key_pos = tile_start + tile_row;
                let row = batch_index * params.kv_len + key_pos;
                let global_index = row * kv_width + kv_head * params.head_dim + dim;
                let shared_index = tile_row * MAX_HEAD_DIM + dim;
                k_shared[shared_index] = k[global_index];
                v_shared[shared_index] = v[global_index];
            }
        }
'''

          old_k = '''            var k_linear = lane;
            loop {
                if (k_linear >= k_pair_count) {
                    break;
                }
                let tile_row = k_linear / half_dim;
                let pair = k_linear - tile_row * half_dim;
                let key_pos = tile_start + tile_row;
                let base = tile_row * MAX_HEAD_DIM + 2u * pair;
                let rotated = rope_pair(
                    k_shared[base],
                    k_shared[base + 1u],
                    pair,
                    key_pos + params.kv_rope_offset,
                    params.head_dim,
                    theta,
                );
                k_shared[base] = rotated.x;
                k_shared[base + 1u] = rotated.y;
                k_linear += WORKGROUP_SIZE;
            }
'''
          new_k = '''            for (var k_step = 0u; k_step < 8u; k_step += 1u) {
                let k_linear = lane + k_step * WORKGROUP_SIZE;
                if (k_linear < k_pair_count) {
                    let tile_row = k_linear / half_dim;
                    let pair = k_linear - tile_row * half_dim;
                    let key_pos = tile_start + tile_row;
                    let base = tile_row * MAX_HEAD_DIM + 2u * pair;
                    let rotated = rope_pair(
                        k_shared[base],
                        k_shared[base + 1u],
                        pair,
                        key_pos + params.kv_rope_offset,
                        params.head_dim,
                        theta,
                    );
                    k_shared[base] = rotated.x;
                    k_shared[base + 1u] = rotated.y;
                }
            }
'''

          for name, old, new in [('Q rotation', old_q, new_q), ('KV load', old_load, new_load), ('K rotation', old_k, new_k)]:
              if old not in text:
                  raise SystemExit(f'{name} block not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/tmp-m35-uniform-barriers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shaders/flat_fwd_projection_rope_asymmetric.wgsl
          git commit -m 'fix(wgsl): keep asymmetric projection barriers uniform'
          git push origin HEAD:feat/m35-d3d12-windows-qualification
