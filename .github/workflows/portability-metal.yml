name: FLAT Metal qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/M36_METAL.md"
      - "docs/RELEASE_CHECKLIST.md"
      - ".github/workflows/portability-metal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal:
    name: Metal parity
    runs-on: macos-14
    env:
      WGPU_BACKEND: metal
      FLAT_REQUIRE_WGPU: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Report host graphics identity
        shell: bash
        run: |
          set -euo pipefail
          system_profiler SPHardwareDataType SPDisplaysDataType || true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full WGPU parity matrix on Metal
        run: cargo test --features wgpu --tests -- --nocapture --test-threads=1
