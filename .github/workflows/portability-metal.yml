name: FLAT Metal qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "examples/bpb3_gpu_inference.rs"
      - "Cargo.lock"
      - "docs/M36_METAL.md"
      - "docs/RELEASE_CHECKLIST.md"
      - ".github/workflows/portability-metal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal:
    name: Metal parity
    # The macos-14 GitHub-hosted runner was retired on 2026-11-02.
    # Use a supported macOS image for the physical Metal qualification.
    runs-on: macos-15
    env:
      WGPU_BACKEND: metal
      FLAT_REQUIRE_WGPU: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Report host graphics identity
        shell: bash
        run: |
          set -euo pipefail
          system_profiler SPHardwareDataType SPDisplaysDataType || true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full WGPU parity matrix on Metal
        run: cargo test --features wgpu --tests -- --nocapture --test-threads=1
      - name: BPB-3 standalone GPU parity on hosted Metal adapter (may be virtual)
        env:
          BPB_GPU_REQUIRE_PHYSICAL: "0"
          BPB_GPU_REQUIRE_NON_SOFTWARE: "1"
        run: |
          cargo run --locked --release --features wgpu --example bpb3_gpu_inference | tee "$RUNNER_TEMP/bpb3-metal.txt"
          grep -q '^PASS_GPU_INFERENCE_STANDALONE' "$RUNNER_TEMP/bpb3-metal.txt"
          test "$(grep -c '^PASS_GPU_BLOCK_ORACLE' "$RUNNER_TEMP/bpb3-metal.txt")" -eq 4
      - name: Retain hosted Metal study output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bpb3-gpu-metal-${{ github.sha }}
          path: ${{ runner.temp }}/bpb3-metal.txt
          if-no-files-found: warn
          retention-days: 30
