name: FLAT Metal qualification

on:
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/M36_METAL.md"
      - ".github/workflows/portability-metal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal:
    name: Metal parity
    runs-on: macos-14
    env:
      WGPU_BACKEND: metal
      FLAT_REQUIRE_WGPU: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Report host graphics identity
        shell: bash
        run: |
          set -euo pipefail
          system_profiler SPHardwareDataType SPDisplaysDataType || true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full WGPU parity matrix on Metal
        run: cargo test --features wgpu --tests -- --nocapture --test-threads=1
