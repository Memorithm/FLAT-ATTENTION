name: sync-e4b-lock

on:
  push:
    branches:
      - research/a11-e4b-ada-graduation-import

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/a11-e4b-ada-graduation-import
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Generate Cargo.lock deterministically
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit generated lockfile only
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(lock): synchronize ADA graduation dependencies"
          git push origin HEAD:research/a11-e4b-ada-graduation-import
