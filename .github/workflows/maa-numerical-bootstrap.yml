name: maa-numerical-bootstrap

on:
  push:
    branches: ['research/maa-numerical-smoke']
    paths: ['.github/workflows/maa-numerical-bootstrap.yml']

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Memorithm/FLAT-ATTENTION' && github.ref == 'refs/heads/research/maa-numerical-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - name: Prepare the exact lockfile and documentation delta
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/maa-lock-before.toml"
          cargo metadata --format-version 1 > /dev/null
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          old = tomllib.loads((Path(os.environ['RUNNER_TEMP']) / 'maa-lock-before.toml').read_text())
          new = tomllib.loads(Path('Cargo.lock').read_text())
          package = next(p for p in old['package'] if p['name'] == 'flat-algebraic-attention')
          if package.get('dependencies'):
              raise SystemExit('Unexpected existing research dependencies')
          package['dependencies'] = ['flat-attention']
          if new != old:
              raise SystemExit('Cargo resolution changed more than the intended local dev-dependency')

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              if text.count(before) != 1:
                  raise SystemExit(f'Expected exactly one anchor in {path}')
              p.write_text(text.replace(before, after, 1))

          replace_once(
              'README.md',
              '## Non-negotiable design rules\n',
              'MAA-10a adds a [preregistered numerical smoke](docs/research/MAA_NUMERICAL_SMOKE_PREREGISTRATION.md)\n'
              'that executes the existing FLAT oracle on four frozen synthetic cases and eight\n'
              'arms per case. It includes per-domain ablations, density-matched controls, a\n'
              'required dominant-key-drop negative control, and explicit empty-selection handling.\n'
              'It does not measure latency or establish model-quality improvements.\n\n'
              '```bash\n'
              'cargo run -p flat-algebraic-attention --locked --release --example matched_numerical_smoke\n'
              '```\n\n'
              '## Non-negotiable design rules\n',
          )
          replace_once(
              'docs/research/MULTI_ALGEBRA_ATTENTION.md',
              '- **MAA-GPU**:',
              '- **MAA-10a**: preregistered bounded numerical smoke through the existing FLAT oracle, with structural F2/Zhegalkin ablations, matched-density controls, O/LSE diagnostics and required negative/empty controls. See [protocol](MAA_NUMERICAL_SMOKE_PREREGISTRATION.md). Not a performance campaign or completion of full MAA-10.\n'
              '- **MAA-GPU**:',
          )
          PY
          cargo fmt --all
          python3 - <<'PY'
          import subprocess
          allowed = {
              'Cargo.lock',
              'README.md',
              'docs/research/MULTI_ALGEBRA_ATTENTION.md',
              'crates/flat-algebraic-attention/examples/matched_numerical_smoke.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed.issubset(allowed):
              raise SystemExit(f'Unexpected formatting edits: {changed - allowed}')
          PY
          git diff --check
      - name: Commit only the scoped preparation without force pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock README.md docs/research/MULTI_ALGEBRA_ATTENTION.md \
            crates/flat-algebraic-attention/examples/matched_numerical_smoke.rs
          git commit -m 'style(maa): format numerical smoke, synchronize local lock edge and research index'
          git push origin HEAD:refs/heads/research/maa-numerical-smoke
          git rev-parse HEAD
      - name: Qualify the prepared numerical smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p flat-algebraic-attention -- --check
          cargo clippy -p flat-algebraic-attention --locked --all-targets -- -D warnings
          cargo test -p flat-algebraic-attention --locked --all-targets -- --nocapture
          cargo run -p flat-algebraic-attention --locked --release --example matched_numerical_smoke
