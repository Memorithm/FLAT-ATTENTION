name: agent rustfmt autofix

on:
  push:
    branches:
      - agent/m13b3-wgpu-boolean-router

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/m13b3-wgpu-boolean-router
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply exact rustfmt
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add src/api.rs src/boolean_attention_signature.rs src/wgpu_boolean_router.rs tests/m13b2_boolean_attention_signature.rs
          git commit -m 'style: apply exact rustfmt to M13B.3 branch'
          git push origin HEAD:agent/m13b3-wgpu-boolean-router
