name: Fix MAA confirmatory schema once

on:
  push:
    branches: [research/maa-confirmatory-holdout]
    paths: [.github/workflows/fix-maa-confirmatory-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/maa-confirmatory-holdout
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Apply bounded evidence-schema correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/flat-algebraic-attention/examples/confirmatory_holdout.rs')
          s = p.read_text()
          old = '            "case,{case_id},{},{},{},{},{},{},{},{},{},{},{},{},{},{},-,-,-",'
          new = '            "case,{case_id},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},-,-,-",'
          if old not in s:
              raise SystemExit('expected case-row format string not found')
          s = s.replace(old, new, 1)
          anchor = 'fn run() -> Result<Vec<String>> {\n    bind_frozen_manifest()?;'
          replacement = 'fn run() -> Result<Vec<String>> {\n    require(\n        PROTOCOL == "maa-confirmatory-holdout/v1",\n        "confirmatory protocol identity drifted",\n    )?;\n    bind_frozen_manifest()?;'
          if anchor not in s:
              raise SystemExit('expected run binding anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
          cargo fmt -p flat-algebraic-attention -- --check
          cargo clippy -p flat-algebraic-attention --locked --all-targets -- -D warnings
          git diff --exit-code -- Cargo.lock
      - name: Commit source-only correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI Tarek'
          git config user.email contact@checkupauto.fr
          git rm .github/workflows/fix-maa-confirmatory-once.yml
          git add crates/flat-algebraic-attention/examples/confirmatory_holdout.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix(maa): make frozen confirmatory CSV schema compile'
          git push origin HEAD:research/maa-confirmatory-holdout
