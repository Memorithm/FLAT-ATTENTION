name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Check EPG core formatting
        run: cargo fmt --manifest-path crates/epg-core/Cargo.toml -- --check
      - name: Lint EPG core
        run: cargo clippy --manifest-path crates/epg-core/Cargo.toml --all-targets -- -D warnings
      - name: Test EPG core contract
        run: cargo test --manifest-path crates/epg-core/Cargo.toml
      - name: Check EPG reference crate formatting
        run: cargo fmt --manifest-path crates/flat-epg-reference/Cargo.toml -- --check
      - name: Lint EPG reference crate
        run: cargo clippy --manifest-path crates/flat-epg-reference/Cargo.toml --all-targets -- -D warnings
      - name: Test EPG reference contract
        run: cargo test --manifest-path crates/flat-epg-reference/Cargo.toml
      - name: Check EPG WGPU qualification formatting
        run: cargo fmt --manifest-path crates/flat-epg-wgpu/Cargo.toml -- --check
      - name: Lint EPG WGPU qualification crate
        run: cargo clippy --manifest-path crates/flat-epg-wgpu/Cargo.toml --all-targets -- -D warnings
      - name: Validate EPG qualification WGSL without a device
        run: cargo test --manifest-path crates/flat-epg-wgpu/Cargo.toml qualification_shader_parses_and_validates_with_naga_020
      - name: Check EPG Q4 candidate formatting
        run: cargo fmt --manifest-path crates/flat-epg-q4-candidate/Cargo.toml -- --check
      - name: Lint EPG Q4 candidate
        run: cargo clippy --manifest-path crates/flat-epg-q4-candidate/Cargo.toml --all-targets -- -D warnings
      - name: Validate EPG Q4 candidate WGSL without a device
        run: cargo test --manifest-path crates/flat-epg-q4-candidate/Cargo.toml q4_candidate_shader_parses_and_validates_with_naga_020
      - name: Validate EPG Q4 candidate host rejection without a device
        run: cargo test --manifest-path crates/flat-epg-q4-candidate/Cargo.toml q4_candidate_rejects_unqualified_dimensions_without_a_device

  wgpu-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Install software Vulkan device
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Execute full fused-attention WGPU test matrix
        env:
          FLAT_REQUIRE_WGPU: "1"
        run: cargo test --features wgpu --tests -- --nocapture
      - name: Execute EPG CPU-GPU qualification matrix
        env:
          FLAT_REQUIRE_WGPU: "1"
        run: cargo test --manifest-path crates/flat-epg-wgpu/Cargo.toml -- --nocapture
      - name: Execute EPG Q4 CPU-GPU-baseline qualification matrix
        env:
          FLAT_REQUIRE_WGPU: "1"
        run: cargo test --manifest-path crates/flat-epg-q4-candidate/Cargo.toml -- --nocapture
      - name: Smoke EPG Q4 benchmark protocol on software Vulkan
        timeout-minutes: 5
        env:
          FLAT_EPG_BENCH_ALLOW_SOFTWARE: "1"
          FLAT_EPG_BENCH_WARMUP: "1"
          FLAT_EPG_BENCH_ITERATIONS: "1"
          FLAT_EPG_BENCH_SEQ_LENS: "4"
        run: |
          set -euo pipefail
          output="$(mktemp)"
          cargo run --manifest-path crates/flat-epg-q4-candidate/Cargo.toml \
            --example epg_q4_hardware_sweep --release | tee "$output"
          grep -Fx 'hardware_measurement_eligible=false' "$output"
          grep -Fx 'performance_claim=measurement_only_no_production_routing_change' "$output"
