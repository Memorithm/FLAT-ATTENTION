name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify archived native Dell correctness with independent Rust parser
        shell: bash
        run: |
          set -euo pipefail
          evidence=docs/research/evidence/pvp-dell-native-20261007
          printf '%s  %s\n' 0a195ca81d98bac960a12ecf1c71eb952dc686cddce3944228ff29bad1f990b8 "$evidence/capture.tar.xz" | sha256sum -c -
          rustc --edition=2021 -D warnings --test "$evidence/verify.rs" -o "$RUNNER_TEMP/pvp-dell-verifier-tests"
          "$RUNNER_TEMP/pvp-dell-verifier-tests"
          rustc --edition=2021 -D warnings "$evidence/verify.rs" -o "$RUNNER_TEMP/pvp-dell-verifier"
          capture=$(mktemp -d "$RUNNER_TEMP/pvp-dell-capture.XXXXXXXX")
          tar -xJf "$evidence/capture.tar.xz" -C "$capture"
          "$RUNNER_TEMP/pvp-dell-verifier" "$capture"
      - name: Verify archived native Dell E2E corpus and paired analysis
        shell: bash
        run: |
          set -euo pipefail
          evidence=$GITHUB_WORKSPACE/docs/research/evidence/pvp-dell-e2e-20261007
          echo "d6ac7b314ea9c5273415458ce273205e9947642245a144fcc18644cf1f10b62d  $evidence/capture.tar.xz" | sha256sum -c -
          echo "9e10f8c4e6d0a965ef8b9532562cbfe5b28a3ab2140927b77ba512ef74bf3517  $evidence/invalid-setup-attempts.tar.xz" | sha256sum -c -
          rustc --edition=2021 -D warnings --test "$evidence/verify.rs" -o "$RUNNER_TEMP/pvp-dell-e2e-tests"
          "$RUNNER_TEMP/pvp-dell-e2e-tests"
          rustc --edition=2021 -D warnings "$evidence/verify.rs" -o "$RUNNER_TEMP/pvp-dell-e2e-verify"
          capture=$(mktemp -d "$RUNNER_TEMP/pvp-dell-e2e.XXXXXXXX")
          tar -xJf "$evidence/capture.tar.xz" -C "$capture"
          (cd "$capture"; sha256sum -c "$evidence/FILES.sha256")
          "$RUNNER_TEMP/pvp-dell-e2e-verify" "$capture"
          for summary in analysis.json panels.tsv process-ratios.tsv components.tsv paired-ratios.tsv; do
            cmp "$capture/$summary" "$evidence/$summary"
          done
      - name: Reject vendor CUDA sources
        run: |
          set -euo pipefail
          hits="$(git ls-files '*.cu' '*.cuh' '*.ptx' || true)"
          if [ -n "$hits" ]; then
            echo "Tracked CUDA/PTX sources are forbidden:"
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: Verify Cargo.lock is synchronized
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --document-private-items
      - name: Host-only oracle smoke (no wgpu feature)
        run: |
          set -euo pipefail
          cargo test --test host_oracle_smoke
          cargo run --example hello_attention
          cargo run --example io_model
          cargo run --example m27_dispatch_allocation_accounting
      - name: Host-only inventory gates (no wgpu feature)
        run: |
          set -euo pipefail
          cargo test --test shader_inventory
          cargo test --test example_inventory
          cargo test --test example_manifest
          cargo test --test crate_inventory
          cargo test --test workspace_inventory
      - name: Test host-only contract matrix
        run: cargo test --workspace --all-features
      - name: TDI22 octree host-only paired numerical qualification
        run: |
          set -euo pipefail
          cargo test -p flat-algebraic-attention --example tdi22_octree_qualification
          cargo run -p flat-algebraic-attention --example tdi22_octree_qualification -- --keys 128 --samples 3 > "$RUNNER_TEMP/tdi22-octree-qualification.csv"
          test "$(wc -l < "$RUNNER_TEMP/tdi22-octree-qualification.csv")" -eq 33
          cat "$RUNNER_TEMP/tdi22-octree-qualification.csv"
          # Opt-in V2 mode is independent of the frozen 33-line V1 evidence.
          cargo run -p flat-algebraic-attention --example tdi22_octree_qualification -- --keys 128 --samples 1 --compare-local > "$RUNNER_TEMP/tdi22-subtree-local.csv"
          test "$(wc -l < "$RUNNER_TEMP/tdi22-subtree-local.csv")" -eq 51
          test "$(grep -c ',subtree_local_budget,' "$RUNNER_TEMP/tdi22-subtree-local.csv")" -eq 10
          test "$(grep -c '^separated_clusters,' "$RUNNER_TEMP/tdi22-subtree-local.csv")" -eq 10
      - name: RAE-9 model QKV snapshot protocol and grouped-head oracle
        run: |
          cargo test -p flat-algebraic-attention --example rae9_real_model_bridge
      - name: RAE-8 executable numerical hybrid and dense fallback oracle
        run: |
          cargo test -p flat-algebraic-attention rae_hybrid_execution
          cargo run -p flat-algebraic-attention --example rae8_numeric_hybrid
      - name: RAE-7 bounded hybrid impulse repair exact oracle
        run: |
          cargo test -p flat-algebraic-attention rae_hybrid_repair
          cargo run -p flat-algebraic-attention --example rae7_hybrid_repair
      - name: BPS-11 exact work-efficient Boolean scan oracle
        run: |
          cargo test -p flat-algebraic-attention boolean_work_efficient_scan
          cargo run -p flat-algebraic-attention --example bps11_work_efficient_scan_smoke
      - name: BPS-12 bounded threaded Boolean scan oracle
        run: |
          cargo test -p flat-algebraic-attention boolean_parallel_scan
          cargo run -p flat-algebraic-attention --example bps12_bounded_parallel_smoke
      - name: BPS-14 two-parent Boolean recurrent learning oracle
        run: |
          cargo test -p flat-algebraic-attention boolean_two_tap_memory
          cargo run -p flat-algebraic-attention --example bps14_dual_tap_smoke
      - name: BPS-15 operation-routed Boolean recurrent oracle
        run: |
          cargo test -p flat-algebraic-attention boolean_operator_channels
          cargo run -p flat-algebraic-attention --example bps15_operator_channels_smoke
      - name: BPS-16 per-neuron operation graph exact oracle
        run: |
          cargo test -p flat-algebraic-attention boolean_neuron_graph
          cargo run -p flat-algebraic-attention --example bps16_neuron_graph_smoke
      - name: BPS-17 compiled uniform dispatch and masked groups oracle
        run: |
          cargo test -p flat-algebraic-attention boolean_neuron_graph
          cargo run -p flat-algebraic-attention --example bps17_uniform_fastpath_smoke
      - name: BPS-18 per-operation uniform compilation exact oracle
        run: |
          cargo test -p flat-algebraic-attention boolean_neuron_graph
          cargo run -p flat-algebraic-attention --example bps18_partial_uniform_smoke
      - name: BPS-19 adaptive sparse and direct-lane routing exact oracle
        run: |
          cargo test -p flat-algebraic-attention bps19_
          cargo run -p flat-algebraic-attention --example bps19_adaptive_routing_smoke
      - name: BPS-20 exact compiled dense-gate hybrid oracle
        run: |
          cargo test -p flat-algebraic-attention bps20_
          cargo run -p flat-algebraic-attention --example bps20_dense_guard_smoke
      - name: BPS-21 independently dense Boolean channel exact oracle
        run: |
          cargo test -p flat-algebraic-attention bps21_
          cargo run -p flat-algebraic-attention --example bps21_dense_channels_smoke
      - name: BPS-22 per-neuron gate mask and source activity exact oracle
        run: |
          cargo test -p flat-algebraic-attention bps22_
          cargo run -p flat-algebraic-attention --example bps22_lane_activity_smoke
      - name: BPS-23 exact density-by-topology kernel policy oracle
        run: |
          cargo test -p flat-algebraic-attention bps23_
          cargo run -p flat-algebraic-attention --example bps23_weight_dispatch_smoke
      - name: BPS-24 exact precompiled weight router scalar oracle
        run: |
          cargo test -p flat-algebraic-attention bps24_
          cargo run -p flat-algebraic-attention --example bps24_prepared_router_smoke
      - name: BPS-25 allocation-free chunked Boolean stream scalar oracle
        run: |
          cargo test -p flat-algebraic-attention bps25_
          cargo run -p flat-algebraic-attention --example bps25_chunked_stream_smoke
      - name: BPS-26 topology-cost channel caps exact scalar state oracle
        run: |
          cargo test -p flat-algebraic-attention bps26_
          cargo run -p flat-algebraic-attention --example bps26_topology_cost_smoke
      - name: Validate EPG qualification WGSL without a device
        run: cargo test -p flat-epg-wgpu qualification_shader_parses_and_validates_with_naga_020
      - name: Validate EPG Q4 candidate WGSL without a device
        run: cargo test -p flat-epg-q4-candidate q4_candidate_shader_parses_and_validates_with_naga_020
      - name: Validate EPG Q4 candidate host rejection without a device
        run: cargo test -p flat-epg-q4-candidate q4_candidate_rejects_unqualified_dimensions_without_a_device
      - name: Validate ADA-A1 candidate contract without a device
        run: cargo test -p flat-ada-a1-candidate

  wgpu-device:
    # Keep the complete WGPU suite on the last verified software Vulkan host.
    # Ubuntu 26.04 / LLVM 21 llvmpipe crashed with SIGSEGV in wgpu_matrix;
    # the BPS-9 exact-head Ubuntu 24.04 / LLVM 20 matrix passed unchanged.
    # No WGPU tests or regression gates are skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.89.0
      - name: Install software Vulkan device
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Execute full workspace CPU-GPU test matrix
        env:
          FLAT_REQUIRE_WGPU: "1"
        run: cargo test --workspace --all-features -- --nocapture
      - name: Same-device kernel regression gate
        timeout-minutes: 10
        env:
          FLAT_REQUIRE_WGPU: "1"
          FLAT_REGRESSION_GATE_ITERATIONS: "9"
        run: cargo run --release --features wgpu --example regression_gate
      - name: PVP3d software correctness and protocol smoke
        timeout-minutes: 5
        env:
          FLAT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLAT_SOURCE_REVISION"
          output="$(mktemp)"
          cargo run --locked --release --features wgpu \
            --example pvp3d_three_candidate_bench -- --smoke | tee "$output"
          grep -Fx 'hardware_measurement_eligible=false' "$output"
          grep -Fx 'qualification_status=complete' "$output"
          grep -Fx 'performance_claim=none' "$output"
          test "$(awk -F, '$1 == "smoke" && $7 == 1 && $8 == 1 && $15 == "none" {n++} END {print n+0}' "$output")" -eq 15
          test "$(awk -F, '$1 == "sample" {n++} END {print n+0}' "$output")" -eq 15
      - name: Smoke EPG Q4 benchmark protocol on software Vulkan
        timeout-minutes: 5
        env:
          FLAT_EPG_BENCH_ALLOW_SOFTWARE: "1"
          FLAT_EPG_BENCH_WARMUP: "1"
          FLAT_EPG_BENCH_ITERATIONS: "1"
          FLAT_EPG_BENCH_SEQ_LENS: "4"
        run: |
          set -euo pipefail
          output="$(mktemp)"
          cargo run -p flat-epg-q4-candidate \
            --example epg_q4_hardware_sweep --release | tee "$output"
          grep -Fx 'hardware_measurement_eligible=false' "$output"
          grep -Fx 'performance_claim=measurement_only_no_production_routing_change' "$output"
