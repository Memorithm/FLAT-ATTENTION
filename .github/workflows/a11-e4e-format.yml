name: A11 E4e format

on:
  push:
    branches:
      - research/a11-e4e-semantic-request-policy

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/a11-e4e-semantic-request-policy
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting only
        run: |
          if git diff --quiet -- crates/flat-semantic-control/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/flat-semantic-control/src/lib.rs
          git commit -m "style(a11): format E4e semantic control"
          git push origin HEAD:research/a11-e4e-semantic-request-policy
