name: tmp-m30-export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m30-stable-api-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Export versioned backend-neutral API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          text = path.read_text()
          marker = 'use core::fmt;\n\n'
          addition = 'use core::fmt;\n\n/// Versioned backend-neutral reusable API.\npub mod api;\n\n'
          if 'pub mod api;' not in text:
              if marker not in text:
                  raise SystemExit('lib.rs insertion marker not found')
              text = text.replace(marker, addition, 1)
              path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit export and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-m30-export.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/api.rs .github/workflows/tmp-m30-export.yml
          git commit -m 'feat(m30): export stable API v1 from crate root'
          git push origin HEAD:feat/m30-stable-api-v1
