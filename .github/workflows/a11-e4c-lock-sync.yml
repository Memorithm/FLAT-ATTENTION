name: A11 E4c lock sync

on:
  push:
    branches:
      - research/a11-e4c-semantic-contract

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/a11-e4c-semantic-contract
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Generate lockfile through Cargo
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v '^M  Cargo.lock$' || true)"
          git commit -m "chore(a11): sync Cargo.lock"
          git push origin HEAD:research/a11-e4c-semantic-contract
