name: A11 E4e normalize

on:
  push:
    branches:
      - research/a11-e4e-semantic-selection

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/a11-e4e-semantic-selection
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Generate lockfile and apply formatter
        run: |
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
      - name: Commit generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          if [ -z "$changed" ]; then
            echo "Workspace already normalized"
            exit 0
          fi
          allowed=$'Cargo.lock\ncrates/flat-semantic-selection/src/lib.rs'
          test "$changed" = "$allowed" || test "$changed" = "Cargo.lock" || test "$changed" = "crates/flat-semantic-selection/src/lib.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/flat-semantic-selection/src/lib.rs
          git commit -m "chore(a11): normalize E4e workspace artifacts"
          git push origin HEAD:research/a11-e4e-semantic-selection
