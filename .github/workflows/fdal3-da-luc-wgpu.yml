name: FDAL3 DA-LUC direct compressed WGPU qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/research_da_luc_oracle.rs"
      - "src/research_da_luc_wgpu.rs"
      - "shaders/flat_da_luc_decode.wgsl"
      - "tests/fdal3_da_luc_wgpu.rs"
      - "docs/FDAL3_DA_LUC_WGPU_CANDIDATE.md"
      - ".github/workflows/fdal3-da-luc-wgpu.yml"

permissions:
  contents: read

concurrency:
  group: fdal3-da-luc-wgpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    name: FDAL3 fail-closed host contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Exact-head format gate
        run: cargo fmt --all -- --check
      - name: Exact-head strict lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Capability and no-dense-materialization contract
        run: >-
          cargo test --features wgpu --test fdal3_da_luc_wgpu
          fdal3_plan_is_narrow_fail_closed_and_declares_no_dense_materialization
          -- --nocapture

  lavapipe-correctness:
    name: FDAL3 direct compressed parity on Vulkan lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WGPU_BACKEND: vulkan
      FLAT_REQUIRE_WGPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Install Mesa Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Report Vulkan adapter
        run: vulkaninfo --summary || true
      - name: Direct compressed WGPU versus FDAL2 scalar oracle
        run: >-
          cargo test --features wgpu --test fdal3_da_luc_wgpu
          direct_compressed_wgpu_matches_fdal2_scalar_oracle
          -- --nocapture
