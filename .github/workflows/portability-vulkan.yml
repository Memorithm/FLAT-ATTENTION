name: FLAT Vulkan Linux qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/M34_VULKAN_LINUX.md"
      - "docs/RELEASE_CHECKLIST.md"
      - ".github/workflows/portability-vulkan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lavapipe:
    name: Vulkan software reference parity
    runs-on: ubuntu-24.04
    env:
      WGPU_BACKEND: vulkan
      FLAT_REQUIRE_WGPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Install Mesa Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Report Vulkan adapter
        run: vulkaninfo --summary || true
      - name: Full WGPU parity matrix on lavapipe
        run: cargo test --features wgpu --tests -- --nocapture
