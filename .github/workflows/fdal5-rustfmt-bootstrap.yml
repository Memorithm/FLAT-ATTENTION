name: FDAL5 rustfmt bootstrap

on:
  push:
    branches:
      - research/fdal5-dynamic-precision-tiers
    paths:
      - ".github/workflows/fdal5-rustfmt-bootstrap.yml"

permissions:
  contents: write

jobs:
  format-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/fdal5-dynamic-precision-tiers
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Format FDAL5 and self-remove
        run: |
          cargo fmt --all
          rm .github/workflows/fdal5-rustfmt-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_da_luc_tiering.rs tests/fdal5_da_luc_tiering.rs .github/workflows/fdal5-rustfmt-bootstrap.yml
          git commit -m "style(fdal5): apply rustfmt"
          git push origin HEAD:research/fdal5-dynamic-precision-tiers
