name: FLAT Direct3D 12 Windows qualification

on:
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/M35_D3D12_WINDOWS.md"
      - ".github/workflows/portability-d3d12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3d12:
    name: Direct3D 12 parity
    runs-on: windows-2022
    env:
      WGPU_BACKEND: dx12
      WGPU_DX12_COMPILER: dxc
      FLAT_REQUIRE_WGPU: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Stage Windows SDK DXC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            'C:\Program Files (x86)\Windows Kits\10\bin',
            'C:\Program Files\Windows Kits\10\bin'
          ) | Where-Object { Test-Path $_ }
          $compiler = Get-ChildItem -Path $roots -Filter dxcompiler.dll -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\dxcompiler\.dll$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $compiler) {
            throw 'DXC runtime unavailable on the Windows runner: dxcompiler.dll not found'
          }
          $dxil = Join-Path $compiler.DirectoryName 'dxil.dll'
          if (-not (Test-Path $dxil)) {
            throw "DXC runtime incomplete: $dxil not found"
          }
          Copy-Item $compiler.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE 'dxcompiler.dll') -Force
          Copy-Item $dxil -Destination (Join-Path $env:GITHUB_WORKSPACE 'dxil.dll') -Force
          Write-Host "Using DXC runtime from $($compiler.DirectoryName)"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rectangular D3D12 smoke tests
        run: cargo test --features wgpu --test m11_rectangular_wgpu -- --nocapture --test-threads=1
      - name: Full WGPU parity matrix on Direct3D 12
        run: cargo test --features wgpu --tests -- --nocapture --test-threads=1
