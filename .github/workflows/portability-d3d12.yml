name: FLAT Direct3D 12 Windows qualification

on:
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/M35_D3D12_WINDOWS.md"
      - ".github/workflows/portability-d3d12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3d12:
    name: Direct3D 12 parity
    runs-on: windows-2022
    env:
      WGPU_DX12_COMPILER: dxc
      RUST_BACKTRACE: "1"
      WARP_VERSION: "1.0.8"
      DXC_RELEASE: "v1.8.2505.1"
      DXC_FILENAME: "dxc_2025_07_14.zip"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile the complete Windows WGPU test surface
        run: cargo test --features wgpu --tests --no-run
      - name: Install supported DXC for the WGPU D3D12 qualification
        shell: bash
        run: |
          set -euo pipefail
          curl.exe -L --retry 5 \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$DXC_RELEASE/$DXC_FILENAME" \
            -o dxc.zip
          rm -rf dxc
          7z.exe e dxc.zip -odxc bin/x64/{dxc.exe,dxcompiler.dll,dxil.dll}
          cygpath --windows "$PWD/dxc" >> "$GITHUB_PATH"
      - name: Install WARP software D3D12 device
        shell: bash
        run: |
          set -euo pipefail
          dxc --version
          curl.exe -L --retry 5 \
            "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.WARP/$WARP_VERSION" \
            -o warp.zip
          rm -rf warp
          7z.exe e warp.zip -owarp build/native/amd64/d3d10warp.dll
          mkdir -p target/debug target/debug/deps
          cp -v warp/d3d10warp.dll target/debug/
          cp -v warp/d3d10warp.dll target/debug/deps/
      - name: Explicit D3D12 WARP pipeline and oracle parity
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "m35-d3d12.log"
          & cargo test --features wgpu --test m35_d3d12_wgpu -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = (Get-Content $log -Tail 40) -join " | "
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=M35 D3D12 test failure::$tail"
            exit $exitCode
          }
