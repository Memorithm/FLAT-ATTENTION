name: FLAT Direct3D 12 Windows qualification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/M35_D3D12_WINDOWS.md"
      - ".github/workflows/portability-d3d12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3d12:
    name: Direct3D 12 parity
    runs-on: windows-2022
    env:
      WGPU_DX12_COMPILER: dxc
      RUST_BACKTRACE: "1"
      DXC_RELEASE: "v1.8.2505.1"
      DXC_FILENAME: "dxc_2025_07_14.zip"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile the complete Windows WGPU test surface
        run: cargo test --features wgpu --tests --no-run
      - name: Install supported DXC for the WGPU D3D12 qualification
        shell: bash
        run: |
          set -euo pipefail
          curl.exe -L --retry 5 \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$DXC_RELEASE/$DXC_FILENAME" \
            -o dxc.zip
          rm -rf dxc
          7z.exe e dxc.zip -odxc bin/x64/{dxc.exe,dxcompiler.dll,dxil.dll}
          cygpath --windows "$PWD/dxc" >> "$GITHUB_PATH"
      - name: Verify D3D12 compiler
        shell: bash
        run: |
          set -euo pipefail
          dxc --version
          echo "Using the Windows-hosted system WARP fallback adapter; no private d3d10warp.dll is injected beside the test binary."
      - name: Explicit D3D12 WARP pipeline and oracle parity
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "m35-d3d12.log"
          & cargo test --features wgpu --test m35_d3d12_wgpu -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $tail = (Get-Content $log -Tail 40) -join " | "
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=M35 D3D12 test failure::$tail"
            exit $exitCode
          }
