name: FLAT Direct3D 12 Windows qualification

on:
  pull_request:
    paths:
      - "src/**"
      - "shaders/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/M35_D3D12_WINDOWS.md"
      - ".github/workflows/portability-d3d12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d3d12:
    name: Direct3D 12 parity
    runs-on: windows-2022
    env:
      WGPU_BACKEND: dx12
      FLAT_REQUIRE_WGPU: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full WGPU parity matrix on Direct3D 12
        run: cargo test --features wgpu --tests -- --nocapture
