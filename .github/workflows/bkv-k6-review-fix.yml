name: BKV-K6 review fix

on:
  push:
    branches:
      - feat/bkv-k6-selected-paged-decode

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/bkv-k6-selected-paged-decode
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt,clippy
      - name: Apply and validate encode-time revalidation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bkv_k6_review_fix.py
          rm tools/bkv_k6_review_fix.py .github/workflows/bkv-k6-review-fix.yml
          cargo fmt --all
          cargo test --all-features --test bkv6_selected_paged_decode
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add src/wgpu_boolean_selected_paged_decode.rs tests/bkv6_selected_paged_decode.rs tools/bkv_k6_review_fix.py .github/workflows/bkv-k6-review-fix.yml
          git commit -m "fix: revalidate BIKV table at encode time"
          git push origin HEAD:feat/bkv-k6-selected-paged-decode
