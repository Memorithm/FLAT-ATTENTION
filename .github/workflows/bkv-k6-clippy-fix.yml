name: BKV-K6 structured test fix

on:
  push:
    branches:
      - feat/bkv-k6-selected-paged-decode

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/bkv-k6-selected-paged-decode
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Refactor BKV-K6 test helpers and format
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/bkv6_selected_paged_decode.rs')
          s = p.read_text()

          old = '''fn restricted_oracle(
              q: &[f32],
              raw_k: &[f32],
              v: &[f32],
              q_heads: usize,
              kv_heads: usize,
              head_dim: usize,
              query_position: usize,
              selected_positions: &[usize],
              theta: f32,
          ) -> (Vec<f32>, Vec<f32>) {
              let mut output = vec![0.0f32; q_heads * head_dim];
              let mut lse = vec![0.0f32; q_heads];
              let group_size = q_heads / kv_heads;
              let scale = 1.0 / (head_dim as f32).sqrt();
              let kv_width = kv_heads * head_dim;

              for q_head in 0..q_heads {
          '''
          new = '''#[derive(Clone, Copy)]
          struct TestAttentionGeometry {
              q_heads: usize,
              kv_heads: usize,
              head_dim: usize,
              theta: f32,
              query_position: usize,
          }

          #[derive(Clone, Copy)]
          struct DeviceInputs<'a> {
              q: &'a wgpu::Buffer,
              k: &'a wgpu::Buffer,
              v: &'a wgpu::Buffer,
          }

          fn restricted_oracle(
              q: &[f32],
              raw_k: &[f32],
              v: &[f32],
              geometry: TestAttentionGeometry,
              selected_positions: &[usize],
          ) -> (Vec<f32>, Vec<f32>) {
              let TestAttentionGeometry {
                  q_heads,
                  kv_heads,
                  head_dim,
                  theta,
                  query_position,
              } = geometry;
              let mut output = vec![0.0f32; q_heads * head_dim];
              let mut lse = vec![0.0f32; q_heads];
              let group_size = q_heads / kv_heads;
              let scale = 1.0 / (head_dim as f32).sqrt();
              let kv_width = kv_heads * head_dim;

              for (q_head, lse_value) in lse.iter_mut().enumerate() {
          '''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('        lse[q_head] = maximum + denominator.ln();', '        *lse_value = maximum + denominator.ln();', 1)

          old = '''fn run_selected(
              harness: &DeviceHarness,
              pipeline: &WgpuBooleanSelectedPagedDecodePipeline,
              page_table: &BooleanSelectedPagedKvTable,
              q_gpu: &wgpu::Buffer,
              k_gpu: &wgpu::Buffer,
              v_gpu: &wgpu::Buffer,
              q_heads: usize,
              kv_heads: usize,
              head_dim: usize,
              theta: f32,
              query_position: usize,
          ) -> Vec<f32> {
          '''
          new = '''fn run_selected(
              harness: &DeviceHarness,
              pipeline: &WgpuBooleanSelectedPagedDecodePipeline,
              page_table: &BooleanSelectedPagedKvTable,
              inputs: DeviceInputs<'_>,
              geometry: TestAttentionGeometry,
          ) -> Vec<f32> {
              let TestAttentionGeometry {
                  q_heads,
                  kv_heads,
                  head_dim,
                  theta,
                  query_position,
              } = geometry;
          '''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('                q: q_gpu,\n                k: k_gpu,\n                v: v_gpu,', '                q: inputs.q,\n                k: inputs.k,\n                v: inputs.v,', 1)

          marker = '    let pipeline = WgpuBooleanSelectedPagedDecodePipeline::new(&harness.device).unwrap();\n'
          replacement = '''    let pipeline = WgpuBooleanSelectedPagedDecodePipeline::new(&harness.device).unwrap();
              let geometry = TestAttentionGeometry {
                  q_heads,
                  kv_heads,
                  head_dim,
                  theta,
                  query_position,
              };
              let inputs = DeviceInputs {
                  q: &q_gpu,
                  k: &k_gpu,
                  v: &v_gpu,
              };
          '''
          assert marker in s
          s = s.replace(marker, replacement, 1)

          old_call = '''    let all_actual = run_selected(
                  &harness,
                  &pipeline,
                  &all_table,
                  &q_gpu,
                  &k_gpu,
                  &v_gpu,
                  q_heads,
                  kv_heads,
                  head_dim,
                  theta,
                  query_position,
              );
          '''
          assert old_call in s
          s = s.replace(old_call, '    let all_actual = run_selected(&harness, &pipeline, &all_table, inputs, geometry);\n', 1)

          old_call = '''    let sparse_actual = run_selected(
                  &harness,
                  &pipeline,
                  &sparse_table,
                  &q_gpu,
                  &k_gpu,
                  &v_gpu,
                  q_heads,
                  kv_heads,
                  head_dim,
                  theta,
                  query_position,
              );
          '''
          assert old_call in s
          s = s.replace(old_call, '    let sparse_actual = run_selected(&harness, &pipeline, &sparse_table, inputs, geometry);\n', 1)

          old_call = '''    let (sparse_output, sparse_lse) = restricted_oracle(
                  &q,
                  &raw_k,
                  &v,
                  q_heads,
                  kv_heads,
                  head_dim,
                  query_position,
                  &[0, 1, 4, 5],
                  theta,
              );
          '''
          assert old_call in s
          s = s.replace(old_call, '    let (sparse_output, sparse_lse) = restricted_oracle(&q, &raw_k, &v, geometry, &[0, 1, 4, 5]);\n', 1)

          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add tests/bkv6_selected_paged_decode.rs
          git commit -m "test: structure BKV-K6 helper inputs"
          git push origin HEAD:feat/bkv-k6-selected-paged-decode
