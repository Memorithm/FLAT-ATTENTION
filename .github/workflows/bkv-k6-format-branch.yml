name: BKV-K6 branch formatter

on:
  push:
    branches:
      - feat/bkv-k6-selected-paged-decode

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/bkv-k6-selected-paged-decode
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Apply repository rustfmt
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- src/wgpu_boolean_selected_paged_decode.rs tests/bkv6_selected_paged_decode.rs; then
            exit 0
          fi
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add src/wgpu_boolean_selected_paged_decode.rs tests/bkv6_selected_paged_decode.rs
          git commit -m "style: apply rustfmt to BKV-K6"
          git push origin HEAD:feat/bkv-k6-selected-paged-decode
