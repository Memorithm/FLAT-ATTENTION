name: FDAL5 parent cleanup bootstrap

on:
  push:
    branches:
      - research/fdal5-dynamic-precision-tiers
    paths:
      - ".github/workflows/fdal5-parent-cleanup-bootstrap.yml"

permissions:
  contents: write

jobs:
  restore-and-wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/fdal5-dynamic-precision-tiers
          fetch-depth: 0
      - name: Restore parent and insert only FDAL5 module declaration
        run: |
          git checkout origin/main -- src/research_da_luc_oracle.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/research_da_luc_oracle.rs')
          text = path.read_text()
          needle = '''/// Research-only portable direct-compressed WGPU candidate (FDAL3).\n#[cfg(feature = "wgpu")]\n#[path = "research_da_luc_wgpu.rs"]\npub mod wgpu;\n'''
          insertion = needle + '''\n/// Research-only deterministic dynamic precision tier routing (FDAL5).\n#[path = "research_da_luc_tiering.rs"]\npub mod tiering;\n'''
          if text.count(needle) != 1:
              raise SystemExit('FDAL3 module declaration anchor not unique')
          text = text.replace(needle, insertion, 1)
          path.write_text(text)
          PY
          rm .github/workflows/fdal5-parent-cleanup-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_da_luc_oracle.rs .github/workflows/fdal5-parent-cleanup-bootstrap.yml
          git commit -m "fix(fdal5): keep parent oracle wiring minimal"
          git push origin HEAD:research/fdal5-dynamic-precision-tiers
