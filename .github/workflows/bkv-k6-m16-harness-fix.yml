name: BKV-K6 M16 harness fix

on:
  push:
    branches:
      - research/bkv-k6-m16-qualification-harness

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/bkv-k6-m16-qualification-harness
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format and validate harness
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --features wgpu --test bkv6_m16_qualification
          cargo clippy --features wgpu --test bkv6_m16_qualification -- -D warnings
          git diff --check
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add tests/bkv6_m16_qualification.rs
          git rm .github/workflows/bkv-k6-m16-harness-fix.yml
          git commit -m "test: validate BKV-K6 M16 qualification harness"
          git push origin HEAD:research/bkv-k6-m16-qualification-harness
