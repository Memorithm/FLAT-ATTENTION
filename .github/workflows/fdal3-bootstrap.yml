name: FDAL3 bootstrap

on:
  push:
    branches:
      - research/fdal3-wgpu-direct-compressed
    paths:
      - ".github/workflows/fdal3-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch-parent-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/fdal3-wgpu-direct-compressed
          fetch-depth: 0
      - name: Patch oracle parent and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/research_da_luc_oracle.rs")
          text = path.read_text()
          needle = '''/// Research-only direct q_len=1 compressed-attention oracle (FDAL2).\n#[path = "research_da_luc_decode_oracle.rs"]\npub mod decode;\n'''
          insert = needle + '''\n/// Research-only portable direct-compressed WGPU candidate (FDAL3).\n#[cfg(feature = "wgpu")]\n#[path = "research_da_luc_wgpu.rs"]\npub mod wgpu;\n'''
          if 'pub mod wgpu;' not in text:
              if needle not in text:
                  raise SystemExit("FDAL2 module anchor not found")
              path.write_text(text.replace(needle, insert, 1))
          PY
          rm .github/workflows/fdal3-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_da_luc_oracle.rs .github/workflows/fdal3-bootstrap.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(fdal3): expose WGPU compressed decode child"
          git push origin HEAD:research/fdal3-wgpu-direct-compressed
