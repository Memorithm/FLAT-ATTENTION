name: FDAL5 DA-LUC deterministic tier routing qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/research_da_luc_oracle.rs"
      - "src/research_da_luc_tiering.rs"
      - "tests/fdal5_da_luc_tiering.rs"
      - "docs/FDAL5_DA_LUC_DYNAMIC_TIERS.md"
      - ".github/workflows/fdal5-da-luc-tiering.yml"

permissions:
  contents: read

concurrency:
  group: fdal5-da-luc-tiering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-routing:
    name: FDAL5 deterministic routing oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Exact-head format gate
        run: cargo fmt --all -- --check
      - name: Exact-head strict lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Deterministic recency and attention-mass routing
        run: cargo test --test fdal5_da_luc_tiering -- --nocapture
      - name: Repeat routing tests
        run: cargo test --test fdal5_da_luc_tiering -- --nocapture
