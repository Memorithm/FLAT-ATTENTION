name: FDAL3 rustfmt bootstrap

on:
  push:
    branches:
      - research/fdal3-wgpu-direct-compressed
    paths:
      - ".github/workflows/fdal3-rustfmt-bootstrap.yml"

permissions:
  contents: write

jobs:
  rustfmt-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/fdal3-wgpu-direct-compressed
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Format FDAL3 and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/fdal3-rustfmt-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_da_luc_oracle.rs src/research_da_luc_wgpu.rs tests/fdal3_da_luc_wgpu.rs .github/workflows/fdal3-rustfmt-bootstrap.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(fdal3): apply rustfmt"
          git push origin HEAD:research/fdal3-wgpu-direct-compressed
