name: Semantic observability branch qualification

on:
  push:
    branches:
      - "feat/semantic-research-observability"

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/semantic-research-observability
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Synchronize workspace lockfile
        run: cargo check -p flat-semantic-observability
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict lint
        run: cargo clippy -p flat-semantic-observability --all-targets -- -D warnings
      - name: Documentation warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p flat-semantic-observability --no-deps
      - name: Observability tests
        run: cargo test -p flat-semantic-observability -- --nocapture
      - name: Commit normalized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock crates/flat-semantic-observability
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(semantic): normalize observability crate"
          git push origin HEAD:feat/semantic-research-observability
