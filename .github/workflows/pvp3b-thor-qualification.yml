name: FLAT PVP3b Thor qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/pvp_vec4.rs"
      - "src/pvp_fused2.rs"
      - "shaders/flat_pvp_vec4.wgsl"
      - "shaders/flat_pvp_vec4_fused2.wgsl"
      - "examples/pvp3b_fused2_bench.rs"
      - "Cargo.toml"
      - ".github/workflows/pvp3b-thor-qualification.yml"

permissions:
  contents: read

concurrency:
  group: flat-pvp3b-thor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  thor:
    name: PVP2 vec4 versus PVP3a fused2 on physical Thor
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 180
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_INCREMENTAL: "0"
      SCIRUST_THOR_GPU_LOCK: /dev/nvidia0
      FLAT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      FLAT_THOR_IDLE_SETTLE_SECONDS: "300"
      WGPU_BACKEND: vulkan
      FLAT_PVP3B_WARMUPS: "5"
      FLAT_PVP3B_REPEATS: "30"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare isolated Rust toolchain directories
        shell: bash
        run: |
          set -euo pipefail
          toolchain_dir="$(mktemp -d "$RUNNER_TEMP/flat-pvp3b-toolchain.XXXXXX")"
          chmod 700 "$toolchain_dir"
          mkdir -p "$toolchain_dir/cargo-home" "$toolchain_dir/rustup-home"
          echo "CARGO_HOME=$toolchain_dir/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$toolchain_dir/rustup-home" >> "$GITHUB_ENV"
          echo "$toolchain_dir/cargo-home/bin" >> "$GITHUB_PATH"
          echo "FLAT_PVP3B_TOOLCHAIN_DIR=$toolchain_dir" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.89.0

      - name: Require persistent physical Thor runner
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_NAME" in
            tarek-scirust-arm64-01|tarek-scirust-arm64-02|tarek-scirust-arm64-03|tarek-scirust-arm64-04) ;;
            *)
              echo "::error::PVP3b requires tarek-scirust-arm64-01..04; refusing $RUNNER_NAME"
              exit 1
              ;;
          esac
          actual="$(git rev-parse HEAD)"
          echo "source_revision=$actual"
          test "$actual" = "$FLAT_SOURCE_REVISION"
          for tool in cargo rustc flock pgrep stat nvidia-smi vulkaninfo awk; do
            command -v "$tool" >/dev/null || {
              echo "::error::PVP3b requires $tool on PATH"
              exit 1
            }
          done
          rustc_release="$(rustc --version --verbose | sed -n 's/^release: //p')"
          rustc_base="${rustc_release%%-*}"
          if [[ ! "$rustc_base" =~ ^([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            echo "::error::unable to parse active rustc release: $rustc_release"
            exit 1
          fi
          rust_major="${BASH_REMATCH[1]}"
          rust_minor="${BASH_REMATCH[2]}"
          if (( 10#$rust_major < 1 || (10#$rust_major == 1 && 10#$rust_minor < 89) )); then
            echo "::error::PVP3b requires rustc >= 1.89; found $rustc_release"
            exit 1
          fi

      - name: Prepare isolated build directories
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/flat-pvp3b-runtime.XXXXXX")"
          build_dir="$(mktemp -d "$GITHUB_WORKSPACE/.flat-pvp3b-build.XXXXXX")"
          chmod 700 "$runtime_dir" "$build_dir"
          mkdir -p "$runtime_dir/xdg" "$runtime_dir/tmp" "$build_dir/target"
          chmod 700 "$runtime_dir/xdg" "$runtime_dir/tmp"
          echo "CARGO_TARGET_DIR=$build_dir/target" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$runtime_dir/xdg" >> "$GITHUB_ENV"
          echo "TMPDIR=$runtime_dir/tmp" >> "$GITHUB_ENV"
          echo "FLAT_PVP3B_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "FLAT_PVP3B_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"

      - name: Build PVP3b benchmark before GPU reservation
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --features wgpu --example pvp3b_fused2_bench
          benchmark="$CARGO_TARGET_DIR/release/examples/pvp3b_fused2_bench"
          test -x "$benchmark"
          echo "FLAT_PVP3B_BENCHMARK=$benchmark" >> "$GITHUB_ENV"

      - name: Exclusive physical Thor PVP3b sweep
        shell: bash
        timeout-minutes: 150
        run: |
          set -euo pipefail
          if [[ ! -c "$SCIRUST_THOR_GPU_LOCK" || ! -r "$SCIRUST_THOR_GPU_LOCK" || ! -w "$SCIRUST_THOR_GPU_LOCK" ]]; then
            echo "::error::physical Thor lock target is not an accessible driver character device"
            exit 1
          fi

          stat -Lc 'gpu_lock_target=%n st_dev=%d inode=%i rdev_hex=%t:%T mode=%a owner=%U:%G type=%F'             "$SCIRUST_THOR_GPU_LOCK"
          exec 9<>"$SCIRUST_THOR_GPU_LOCK"
          flock -x 9
          if flock -n "$SCIRUST_THOR_GPU_LOCK" -c 'true'; then
            echo "::error::physical GPU lock does not contend independently"
            exit 1
          fi

          inventory="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader)"
          printf '%s\n' "$inventory"
          grep -F 'NVIDIA Thor' <<< "$inventory" >/dev/null
          summary="$(vulkaninfo --summary 2>&1)"
          grep -F 'NVIDIA Tegra NVIDIA Thor' <<< "$summary" >/dev/null

          compute_processes() {
            nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader 2>/dev/null
          }

          settled=0
          while (( settled < 10#$FLAT_THOR_IDLE_SETTLE_SECONDS )); do
            training="$(pgrep -af '[c]uda_pretrain' || true)"
            active="$(compute_processes)"
            if [[ -n "${training//[[:space:]]/}" || -n "${active//[[:space:]]/}" ]]; then
              echo "::notice::PVP3b deferred because Thor is already busy; no performance claim is accepted"
              {
                echo "### PVP3b physical Thor qualification deferred"
                echo
                echo "Exact source and runner identity were validated and the benchmark built, but the GPU was occupied before measurement."
                echo "No PVP3b timing was accepted."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "qualification_status=deferred_gpu_busy"
              echo "performance_claim=none"
              exit 0
            fi
            settled=$((settled + 5))
            sleep 5
          done

          echo "source_revision=$(git rev-parse HEAD)"
          echo "benchmark_scope=PVP2_vec4_vs_PVP3a_fused2_K256_to_1048576_G128_512_2048"
          echo "primary_timing_scope=resident_encode_plus_submit_plus_wait"
          echo "measurement_order=alternating_vec4_fused2"
          output="$RUNNER_TEMP/pvp3b-thor-qualification.log"

          "$FLAT_PVP3B_BENCHMARK" >"$output" 2>&1 &
          bench_pid=$!
          contaminated=0
          while kill -0 "$bench_pid" 2>/dev/null; do
            if pgrep -af '[c]uda_pretrain' >"$RUNNER_TEMP/pvp3b-training.txt"; then
              echo "::error::foreign training process appeared during PVP3b timing"
              cat "$RUNNER_TEMP/pvp3b-training.txt"
              contaminated=1
              break
            fi
            active="$(compute_processes || true)"
            if [[ -n "${active//[[:space:]]/}" ]]; then
              while IFS=',' read -r raw_pid process_name; do
                pid="$(printf '%s' "$raw_pid" | tr -d '[:space:]')"
                process_name="$(printf '%s' "$process_name" | xargs)"
                [[ -z "$pid" ]] && continue
                if [[ "$pid" != "$bench_pid" ]]; then
                  echo "::error::foreign GPU compute during PVP3b: pid=$pid process=$process_name"
                  contaminated=1
                fi
              done <<< "$active"
            fi
            (( contaminated == 0 )) || break
            sleep 1
          done

          if (( contaminated != 0 )); then
            kill "$bench_pid" 2>/dev/null || true
            wait "$bench_pid" 2>/dev/null || true
            exit 1
          fi
          wait "$bench_pid"
          cat "$output"

          grep -F 'benchmark=pvp3b_fused2_same_device' "$output" >/dev/null
          grep -F 'primary_timing_scope=resident_encode_plus_queue_submit_plus_device_wait' "$output" >/dev/null
          grep -F 'status,adapter,backend,k,g,state_bytes,warmups,repeats,vec4_dispatches,fused2_dispatches,vec4_median_ns,vec4_p95_ns,fused2_median_ns,fused2_p95_ns,vec4_over_fused2,fused2_wins,vec4_timestamp_median_ns,fused2_timestamp_median_ns,checksum,performance_claim' "$output" >/dev/null

          rows="$(awk -F, '($1 == "measured" || $1 == "skipped_limit") && $7 == 5 && $8 == 30 && $20 == "none" {count++} END {print count+0}' "$output")"
          test "$rows" -eq 21
          measured="$(awk -F, '$1 == "measured" {count++} END {print count+0}' "$output")"
          test "$measured" -gt 0
          grep -E '^(measured|skipped_limit),NVIDIA Tegra NVIDIA Thor,Vulkan,' "$output" >/dev/null

          post="$(compute_processes)"
          if [[ -n "${post//[[:space:]]/}" ]]; then
            echo "::error::post-PVP3b compute occupancy is not empty"
            printf '%s\n' "$post"
            exit 1
          fi

          {
            echo "### PVP3b physical Thor measurement"
            echo
            echo "Exact source: `$(git rev-parse HEAD)`"
            echo
            echo "Rows: $rows; measured: $measured"
            echo
            echo "The benchmark reports device-specific evidence only; no model-level claim is authorized."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup isolated directories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${FLAT_PVP3B_BUILD_DIR:-}" ]] || rm -rf -- "$FLAT_PVP3B_BUILD_DIR"
          [[ -z "${FLAT_PVP3B_RUNTIME_DIR:-}" ]] || rm -rf -- "$FLAT_PVP3B_RUNTIME_DIR"
          [[ -z "${FLAT_PVP3B_TOOLCHAIN_DIR:-}" ]] || rm -rf -- "$FLAT_PVP3B_TOOLCHAIN_DIR"
