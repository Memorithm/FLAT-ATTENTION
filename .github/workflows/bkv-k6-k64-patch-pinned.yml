name: BKV K6.4 pinned patch staging

on:
  push:
    branches:
      - research/bkv-k6-harness-evidence-output-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/bkv-k6-harness-evidence-output-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Integrate evidence envelope into K6.2 harness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/bkv6_m16_qualification.rs')
          s = p.read_text()
          def r(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'missing anchor: {old[:80]!r}')
              s = s.replace(old, new, 1)
          r('use std::hint::black_box;\n', 'use std::fs;\nuse std::hint::black_box;\n')
          r('#[path = "../src/research_bkv_qualification.rs"]\npub mod research_bkv_qualification;\n', '#[path = "../src/benchmark_manifest.rs"]\npub mod benchmark_manifest;\n#[path = "../src/research_bkv_evidence.rs"]\npub mod research_bkv_evidence;\n#[path = "../src/research_bkv_qualification.rs"]\npub mod research_bkv_qualification;\n')
          r('use boolean_kv::{BooleanKvCache, PackedBooleanSignature};\n', 'use benchmark_manifest::{BenchmarkEnvironment, BenchmarkManifest, BenchmarkProblem, BenchmarkResult};\nuse boolean_kv::{BooleanKvCache, PackedBooleanSignature};\n')
          r('use research_bkv_qualification::{\n    BikvAccountingInput, BikvLatencyInput, BikvPromotionDecision, BikvQualificationRecord,\n};\n', 'use research_bkv_evidence::{BikvEvidenceGates, BikvEvidenceManifest, BikvEvidenceScope};\nuse research_bkv_qualification::{\n    BikvAccountingInput, BikvLatencyInput, BikvPromotionDecision, BikvQualificationRecord,\n};\n')
          r('fn median(mut samples: Vec<u64>) -> u64 {\n    samples.sort_unstable();\n    samples[samples.len() / 2]\n}\n', 'fn median(mut samples: Vec<u64>) -> u64 {\n    samples.sort_unstable();\n    samples[samples.len() / 2]\n}\n\nfn percentile_95(samples: &[u64]) -> u64 {\n    let mut sorted = samples.to_vec();\n    sorted.sort_unstable();\n    let rank = ((sorted.len() * 95).div_ceil(100)).saturating_sub(1);\n    sorted[rank.min(sorted.len() - 1)]\n}\n\nfn tokens_per_second_milli(latency_ns: u64) -> u64 {\n    1_000_000_000_000u64 / latency_ns.max(1)\n}\n')
          r('    let signature_generation_ns = median(signature_samples);\n', '    let candidate_p95_ns = percentile_95(&candidate_total_samples);\n    let dense_p95_ns = percentile_95(&dense_samples);\n    let signature_generation_ns = median(signature_samples);\n')
          anchor = '''    let decision = if !correctness_gate_passed {
        BikvPromotionDecision::FallbackCorrectnessGate
    } else if !quality_gate_passed {
        BikvPromotionDecision::FallbackQualityGate
    } else if candidate_end_to_end_ns >= dense_attention_ns {
        BikvPromotionDecision::FallbackNoLatencyWin
    } else {
        BikvPromotionDecision::Promote
    };

'''
          addition = anchor + '''    let commit = git_head();
    let environment = BenchmarkEnvironment {
        device: info.name.clone(),
        backend: format!("{:?}", info.backend),
        driver: format!("{info:?}"),
        os: std::env::consts::OS.to_owned(),
        arch: std::env::consts::ARCH.to_owned(),
    };
    let problem = BenchmarkProblem {
        precision: "f32".to_owned(),
        batch: 1,
        q_heads: geometry.q_heads,
        kv_heads: geometry.kv_heads,
        query_len: 1,
        kv_len: geometry.kv_len,
        head_dim: geometry.head_dim,
        causal: true,
    };
    let warmup_iterations = u32::try_from(warmup).expect("warmup count fits u32");
    let measured_iterations = u32::try_from(iterations).expect("iteration count fits u32");
    let command = "cargo test --features wgpu --test bkv6_m16_qualification -- --nocapture";
    let candidate_manifest = BenchmarkManifest {
        commit_sha: commit.clone(),
        benchmark_id: "bkv-k6-selected-candidate".to_owned(),
        command: command.to_owned(),
        environment: environment.clone(),
        problem: problem.clone(),
        warmup_iterations,
        measured_iterations,
        result: BenchmarkResult {
            median_latency_ns: candidate_end_to_end_ns,
            p95_latency_ns: candidate_p95_ns,
            tokens_per_second_milli: tokens_per_second_milli(candidate_end_to_end_ns),
        },
    };
    let dense_manifest = BenchmarkManifest {
        commit_sha: commit.clone(),
        benchmark_id: "m16-dense-baseline".to_owned(),
        command: command.to_owned(),
        environment,
        problem,
        warmup_iterations,
        measured_iterations,
        result: BenchmarkResult {
            median_latency_ns: dense_attention_ns,
            p95_latency_ns: dense_p95_ns,
            tokens_per_second_milli: tokens_per_second_milli(dense_attention_ns),
        },
    };
    let evidence = BikvEvidenceManifest {
        candidate: candidate_manifest,
        dense_baseline: dense_manifest,
        qualification: record,
        signature_bits: 8,
        max_distance,
        scope: BikvEvidenceScope {
            timing_scope: "host-observed host-mirrored-query".to_owned(),
            selection_policy: "matched-density synthetic Boolean signatures".to_owned(),
            q_device_resident: true,
            q_host_mirror_retained: true,
            kv_device_resident: true,
            uploads_readbacks_excluded: true,
            resident_only_production_claim: false,
            gpu_timestamp_claim: false,
            physical_dram_traffic_claim: false,
            model_quality_claim: false,
        },
        gates: BikvEvidenceGates {
            all_accept_k6_vs_m16: all_accept_parity,
            sparse_k6_vs_restricted_oracle: sparse_correctness,
            quality_gate_passed,
        },
    };
    assert_eq!(evidence.promotion_decision().unwrap(), decision);
    let evidence_json = evidence.canonical_json().unwrap();
    if let Ok(path) = std::env::var("FLAT_BKV_EVIDENCE_OUT") {
        fs::write(&path, format!("{evidence_json}\\n")).expect("write BKV evidence envelope");
        println!("evidence_output={path}");
    }

'''
          r(anchor, addition)
          r('    println!("commit={}", git_head());\n', '    println!("commit={commit}");\n')
          r('    println!("promotion_decision={decision:?}");\n', '    println!("promotion_decision={decision:?}");\n    println!("evidence_json={evidence_json}");\n')
          p.write_text(s)
          PY
      - name: Format and validate targeted harness
        run: |
          cargo fmt --all
          cargo test --features wgpu --test bkv6_m16_qualification --no-run
          cargo clippy --features wgpu --test bkv6_m16_qualification -- -D warnings
          git diff --check
      - name: Commit final K6.4 change and self-remove workflows
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git rm .github/workflows/bkv-k6-k64-patch.yml .github/workflows/bkv-k6-k64-patch-pinned.yml
          git add tests/bkv6_m16_qualification.rs
          git commit -m "test: emit BKV-K6 qualification evidence envelope"
          git push origin HEAD:research/bkv-k6-harness-evidence-output-v2
