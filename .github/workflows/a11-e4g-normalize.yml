name: A11 E4g normalize

on:
  push:
    branches:
      - research/a11-e4g-device-admissible-forward-plan

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/a11-e4g-device-admissible-forward-plan
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Regenerate lockfile and format workspace
        run: |
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
      - name: Strict lint E4g
        run: cargo clippy -p flat-semantic-plan --all-targets --all-features -- -D warnings
      - name: Test E4g
        run: cargo test -p flat-semantic-plan --all-features
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- Cargo.lock crates/flat-semantic-plan; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/flat-semantic-plan
          git commit -m "chore(a11): normalize E4g planning artifacts"
          git push origin HEAD:research/a11-e4g-device-admissible-forward-plan
