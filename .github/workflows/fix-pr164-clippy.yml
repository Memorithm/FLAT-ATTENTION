name: Fix PR164 observability API

on:
  push:
    branches: [research/tdi-epg-observability]

permissions:
  contents: write

concurrency:
  group: fix-pr164-observability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/tdi-epg-observability
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Refine observed API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/flat-epg-reference/src/research_observability.rs')
          s = p.read_text()
          anchor = 'impl ResearchObserver for NoIntervention {}\n\n'
          insert = '''impl ResearchObserver for NoIntervention {}\n\n/// Mutable research-only observation state passed to the observed oracle.\n///\n/// Grouping the observer and bounded trace keeps instrumentation state explicit\n/// without widening the production/reference API surface.\npub struct ResearchObservationContext<'a, O: ResearchObserver> {\n    /// Intervention/observation hook for this execution.\n    pub observer: &'a mut O,\n    /// Bounded trace retaining deterministic research events.\n    pub trace: &'a mut BoundedResearchTrace,\n}\n\n'''
          if 'pub struct ResearchObservationContext' not in s:
              assert anchor in s
              s = s.replace(anchor, insert, 1)

          old_sig = '''    epg: EpgEmbeddingConfig,\n    observer: &mut O,\n    trace: &mut BoundedResearchTrace,\n) -> Result<FlatAttentionOutput, EpgError> {'''
          new_sig = '''    epg: EpgEmbeddingConfig,\n    research: &mut ResearchObservationContext<'_, O>,\n) -> Result<FlatAttentionOutput, EpgError> {'''
          assert old_sig in s
          s = s.replace(old_sig, new_sig, 1)
          s = s.replace('trace.record(ResearchEvent::Contribution(observation));', 'research.trace.record(ResearchEvent::Contribution(observation));')
          s = s.replace('let intervention = observer.on_contribution(&observation);', 'let intervention = research.observer.on_contribution(&observation);')
          s = s.replace('trace.record(ResearchEvent::QueryComplete(diagnostics));', 'research.trace.record(ResearchEvent::QueryComplete(diagnostics));')
          s = s.replace('observer.on_query_complete(&diagnostics);', 'research.observer.on_query_complete(&diagnostics);')
          call_tail = '''            epg,\n            &mut observer,\n            &mut trace,\n        )'''
          replacement = '''            epg,\n            &mut ResearchObservationContext {\n                observer: &mut observer,\n                trace: &mut trace,\n            },\n        )'''
          count = s.count(call_tail)
          assert count == 4, count
          s = s.replace(call_tail, replacement)
          p.write_text(s)

          p = Path('crates/flat-epg-reference/src/lib.rs')
          s = p.read_text()
          old = '''    InterventionDecision, NoIntervention, QueryDiagnostics, ResearchEvent, ResearchObserver,\n    ResearchSemanticIdentity,\n'''
          new = '''    InterventionDecision, NoIntervention, QueryDiagnostics, ResearchEvent, ResearchObservationContext,\n    ResearchObserver, ResearchSemanticIdentity,\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Commit business fix only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-pr164-clippy.yml
          git add crates/flat-epg-reference/src/lib.rs crates/flat-epg-reference/src/research_observability.rs
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' crates/flat-epg-reference/src/lib.rs crates/flat-epg-reference/src/research_observability.rs | sort)"
          test "$changed" = "$expected"
          git config user.name CHECKUPAUTO
          git config user.email actions@github.com
          git commit -m 'fix(epg): group research observation state'
          git push origin HEAD:research/tdi-epg-observability
