name: supply-chain

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 03:20 UTC — off-the-hour to reduce runner contention.
    - cron: "20 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.0
      # The root manifest resolves the whole workspace graph in one lockfile.
      - name: Check advisories, licenses, sources
        run: cargo deny --all-features check advisories licenses sources
