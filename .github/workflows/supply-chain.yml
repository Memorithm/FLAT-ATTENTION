name: supply-chain

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 03:20 UTC — off-the-hour to reduce runner contention.
    - cron: "20 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.89.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.0
      # The root manifest resolves the whole workspace graph in one lockfile.
      - name: Check advisories, licenses, sources
        run: cargo deny --all-features check advisories licenses sources
