name: FDAL2 DA-LUC compressed decode qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/research_da_luc_oracle.rs"
      - "src/research_da_luc_decode_oracle.rs"
      - "tests/fdal2_da_luc_decode_oracle.rs"
      - "examples/fdal2_da_luc_decode_sweep.rs"
      - "docs/FDAL2_DA_LUC_DECODE_ORACLE.md"
      - ".github/workflows/fdal2-da-luc-decode.yml"

permissions:
  contents: read

concurrency:
  group: fdal2-da-luc-decode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-compressed-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Exact-head format gate
        run: cargo fmt --all -- --check
      - name: Public FDAL2 integration contract
        run: cargo test --test fdal2_da_luc_decode_oracle -- --nocapture
      - name: Deterministic direct-compressed decode sweep
        run: |
          set -euo pipefail
          first="$(mktemp)"
          second="$(mktemp)"
          cargo run --release --example fdal2_da_luc_decode_sweep | tee "$first"
          cargo run --release --example fdal2_da_luc_decode_sweep > "$second"
          cmp "$first" "$second"
          test "$(awk -F, '$1 ~ /^case_[0-9]+$/ {count++} END {print count+0}' "$first")" -eq 8
          test "$(grep -c ',none$' "$first")" -eq 8
