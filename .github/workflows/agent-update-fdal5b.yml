name: Record FDAL5b qualification evidence

on:
  push:
    branches:
      - agent/ecosystem-roadmap
    paths:
      - .github/workflows/agent-update-fdal5b.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ecosystem-roadmap
      - name: Update DA-LUC roadmap evidence
        shell: python
        run: |
          from pathlib import Path
          path = Path('.agent/DA_LUC_RESEARCH_PROGRAM.yaml')
          text = path.read_text()
          text = text.replace('last_updated: "2026-09-03T01:42+0200"', 'last_updated: "2026-09-05T22:23+0200"')
          text = text.replace('status: active_nonsemantic_baseline_qualification_pending\n    evidence:\n      - PR_178_merged_versioned_research_only_tier_routing_plan\n      - deterministic_recency_and_attention_mass_assignments_implemented\n      - explicit_transition_descriptions_without_implicit_mutation\n      - Memorithm_FLAT_ATTENTION_issue_179_tracks_realization_and_equal_budget_baseline_qualification', 'status: complete_nonsemantic_baseline_qualified\n    evidence:\n      - PR_178_merged_versioned_research_only_tier_routing_plan\n      - deterministic_recency_and_attention_mass_assignments_implemented\n      - explicit_transition_descriptions_without_implicit_mutation\n      - PR_180_merged_FDAL5b_host_reference_materialization_and_equal_budget_controls\n      - PR_180_final_exact_head_a4e33d753fc1ef8ff6db61269ff82c91df6dfc4a\n      - PR_180_merge_commit_d0e748b92ca9617d608aa10c93e3d8a6b8627bde\n      - recency_attention_mass_deterministic_random_and_fixed_controls_qualified\n      - exact_realized_byte_budget_rejects_partial_segment_budget_mismatch\n      - GQA_MQA_KV_asymmetry_residual_and_partial_segment_tests_qualified\n      - Memorithm_FLAT_ATTENTION_issue_179_closed_completed')
          text = text.replace('status: blocked_until_a_non_semantic_DA_LUC_baseline_is_qualified', 'status: baseline_prerequisite_qualified_research_not_started')
          text = text.replace('Continue FDAL3 real-device correctness and FDAL5 non-semantic baseline\n  qualification independently. For FDAL4, audit NNIS DAL2 against the complete\n  FLAT FDAL2 direct q_len=1 scalar oracle and permit only an NVIDIA-owned physical\n  scoring/JIT candidate that remains evidence-bound to the same semantics. Keep\n  FDAL6 blocked and make no compressed-KV performance or quality claim before the\n  required real-model and hardware gates.', 'Continue FDAL3 real-device correctness. FDAL5 non-semantic baseline qualification\n  is complete through PR #180. For FDAL4, audit NNIS DAL2 against the complete\n  FLAT FDAL2 direct q_len=1 scalar oracle and permit only an NVIDIA-owned physical\n  scoring/JIT candidate that remains evidence-bound to the same semantics. Keep\n  FDAL6 research unstarted until an explicit preregistered protocol consumes the\n  qualified recency, attention-mass, deterministic-random and fixed controls under\n  identical exact storage and quality workloads. Make no compressed-KV performance\n  or quality claim before the required real-model and hardware gates.')
          path.write_text(text)
      - name: Commit roadmap and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-update-fdal5b.yml
          git add .agent/DA_LUC_RESEARCH_PROGRAM.yaml .github/workflows/agent-update-fdal5b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(agent): record FDAL5b qualification"
          git push origin HEAD:agent/ecosystem-roadmap
