name: BKV-K6.1 format fix

on:
  push:
    branches:
      - research/bkv-k6-qualification-gate

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/bkv-k6-qualification-gate
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format and validate BKV-K6.1
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --test bkv_qualification_gate
          cargo clippy --test bkv_qualification_gate -- -D warnings
          git diff --check
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add src/research_bkv_qualification.rs tests/bkv_qualification_gate.rs
          git rm .github/workflows/bkv-k61-format-fix.yml
          git commit -m "style: format BIKV qualification gate"
          git push origin HEAD:research/bkv-k6-qualification-gate
