name: maa-host

on:
  pull_request:
    paths:
      - 'crates/flat-algebraic-attention/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/maa-host.yml'
      - 'docs/research/MAA*'
  push:
    branches: [main]
    paths:
      - 'crates/flat-algebraic-attention/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/maa-host.yml'
      - 'docs/research/MAA*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - name: Record exact source revision
        run: git rev-parse HEAD
      - name: Check MAA formatting
        run: cargo fmt -p flat-algebraic-attention -- --check
      - name: Strict MAA Clippy
        run: cargo clippy -p flat-algebraic-attention --locked --all-targets -- -D warnings
      - name: Debug host oracle and exhaustive evidence regressions
        run: cargo test -p flat-algebraic-attention --locked --all-targets -- --nocapture
      - name: Release host oracle and exhaustive evidence regressions
        run: cargo test -p flat-algebraic-attention --locked --release --all-targets -- --nocapture
      - name: Frozen numerical smoke and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example matched_numerical_smoke > "$RUNNER_TEMP/maa-numerical-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example matched_numerical_smoke > "$RUNNER_TEMP/maa-numerical-second.csv"
          cmp "$RUNNER_TEMP/maa-numerical-first.csv" "$RUNNER_TEMP/maa-numerical-second.csv"
          cat "$RUNNER_TEMP/maa-numerical-first.csv"
          {
            echo '### MAA-10a synthetic numerical diagnostics (not performance evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-numerical-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Max-Plus readiness/defer smoke and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example max_plus_readiness_smoke > "$RUNNER_TEMP/maa-maxplus-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example max_plus_readiness_smoke > "$RUNNER_TEMP/maa-maxplus-second.csv"
          cmp "$RUNNER_TEMP/maa-maxplus-first.csv" "$RUNNER_TEMP/maa-maxplus-second.csv"
          cat "$RUNNER_TEMP/maa-maxplus-first.csv"
          {
            echo '### MAA-10b Max-Plus readiness diagnostics (abstract time, not performance evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-maxplus-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Max-Plus final-readiness numerical equivalence and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example max_plus_numerical_equivalence > "$RUNNER_TEMP/maa-maxplus-numerical-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example max_plus_numerical_equivalence > "$RUNNER_TEMP/maa-maxplus-numerical-second.csv"
          cmp "$RUNNER_TEMP/maa-maxplus-numerical-first.csv" "$RUNNER_TEMP/maa-maxplus-numerical-second.csv"
          cat "$RUNNER_TEMP/maa-maxplus-numerical-first.csv"
          {
            echo '### MAA-10c final-readiness numerical equivalence (not performance evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-maxplus-numerical-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Frozen confirmatory holdout and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example confirmatory_holdout > "$RUNNER_TEMP/maa-holdout-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example confirmatory_holdout > "$RUNNER_TEMP/maa-holdout-second.csv"
          cmp "$RUNNER_TEMP/maa-holdout-first.csv" "$RUNNER_TEMP/maa-holdout-second.csv"
          cat "$RUNNER_TEMP/maa-holdout-first.csv"
          {
            echo '### MAA-11b frozen synthetic holdout (confirmatory; not performance evidence)'
            echo "Harness revision: $(git rev-parse HEAD)"
            echo 'Frozen policy source revision: 4030b229a2ff329c1263cad677812d659422b448'
            echo '```csv'
            cat "$RUNNER_TEMP/maa-holdout-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Survivor-floor exploratory sweep and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example survivor_floor_sweep > "$RUNNER_TEMP/maa-floor-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example survivor_floor_sweep > "$RUNNER_TEMP/maa-floor-second.csv"
          cmp "$RUNNER_TEMP/maa-floor-first.csv" "$RUNNER_TEMP/maa-floor-second.csv"
          cat "$RUNNER_TEMP/maa-floor-first.csv"
          {
            echo '### MAA-12a survivor-floor exploration (exploratory; not performance or confirmatory evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-floor-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: QK-signature exploratory sweep and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example qk_signature_sweep > "$RUNNER_TEMP/maa-qk-signature-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example qk_signature_sweep > "$RUNNER_TEMP/maa-qk-signature-second.csv"
          cmp "$RUNNER_TEMP/maa-qk-signature-first.csv" "$RUNNER_TEMP/maa-qk-signature-second.csv"
          cat "$RUNNER_TEMP/maa-qk-signature-first.csv"
          {
            echo '### MAA-13a Q/K-derived Boolean signature exploration (not performance or confirmatory evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-qk-signature-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Norm-aware QK exploratory sweep and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example norm_aware_qk_sweep > "$RUNNER_TEMP/maa-norm-aware-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example norm_aware_qk_sweep > "$RUNNER_TEMP/maa-norm-aware-second.csv"
          cmp "$RUNNER_TEMP/maa-norm-aware-first.csv" "$RUNNER_TEMP/maa-norm-aware-second.csv"
          cat "$RUNNER_TEMP/maa-norm-aware-first.csv"
          {
            echo '### MAA-13b norm-aware Q/K exploration (not performance or confirmatory evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-norm-aware-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retained softmax mass evidence and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example retained_softmax_mass > "$RUNNER_TEMP/maa-retained-mass-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example retained_softmax_mass > "$RUNNER_TEMP/maa-retained-mass-second.csv"
          cmp "$RUNNER_TEMP/maa-retained-mass-first.csv" "$RUNNER_TEMP/maa-retained-mass-second.csv"
          cat "$RUNNER_TEMP/maa-retained-mass-first.csv"
          {
            echo '### MAA-13c retained softmax mass evidence (not performance or confirmatory evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-retained-mass-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: MAA-13d mass-aware frontier and reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example mass_aware_frontier > "$RUNNER_TEMP/maa-13d-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example mass_aware_frontier > "$RUNNER_TEMP/maa-13d-second.csv"
          cmp "$RUNNER_TEMP/maa-13d-first.csv" "$RUNNER_TEMP/maa-13d-second.csv"
          cat "$RUNNER_TEMP/maa-13d-first.csv"
          {
            echo '### MAA-13d mass-aware adaptive routing frontier (exploratory; not performance or confirmatory evidence)'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-13d-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: MAA-13d tiered-recall confirmatory holdout
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p flat-algebraic-attention --locked --release --example tiered_recall_confirmatory > "$RUNNER_TEMP/maa-13d-holdout-first.csv"
          cargo run -p flat-algebraic-attention --locked --release --example tiered_recall_confirmatory > "$RUNNER_TEMP/maa-13d-holdout-second.csv"
          cmp "$RUNNER_TEMP/maa-13d-holdout-first.csv" "$RUNNER_TEMP/maa-13d-holdout-second.csv"
          cat "$RUNNER_TEMP/maa-13d-holdout-first.csv"
          {
            echo '### MAA-13d tiered-recall confirmatory holdout'
            echo "Source revision: $(git rev-parse HEAD)"
            echo '```csv'
            cat "$RUNNER_TEMP/maa-13d-holdout-first.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Strict MAA documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p flat-algebraic-attention --locked --no-deps
