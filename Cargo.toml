[package]
name = "flat-attention"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "FLAT-ATTENTION — Rust-native fused linear-memory attention kernels for SciRust"
repository = "https://github.com/Memorithm/FLAT-ATTENTION"
authors = ["Tarek Zekriti"]
license-file = "LICENSE.md"

[features]
default = ["std"]
std = []
wgpu = ["std", "dep:wgpu", "dep:pollster"]

[dependencies]
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }

[dev-dependencies]
naga = { version = "0.20", features = ["wgsl-in"] }
